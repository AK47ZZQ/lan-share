name: lanshare_app
description: "LAN Share 家庭网盘 · 手机 App（Flutter，APP-DESIGN v0.1）"
publish_to: 'none'

version: 1.1.15+122

environment:
  sdk: ^3.13.1

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  # ── v0.19 富文本笔记 + 文档预览重构 ──────────────────────────
  # 富文本笔记（.html 存储，Summernote 内核 WebView 编辑器）：表格/字体颜色
  # 大小/图片 base64 内嵌/对齐缩进等主流笔记能力（Quill 的 Delta 无表格模型，
  # 弃选）；HTML 文件即笔记，网盘可移植、Web 端浏览器可直接预览
  html_editor_enhanced: ^2.7.1
  # 依赖原则（沿 PLAN-v3 §6）：每新增一项在此记录理由（详见 CHANGELOG）。
  dio: ^5.7.0                    # 网络：Bearer 拦截器/401 统一处理/上传进度与取消
  flutter_riverpod: ^3.4.3       # 状态管理（APP-DESIGN §1 选型定稿）
  flutter_secure_storage: ^9.2.2 # 设备 Token 安全存储（Keystore/Keychain）
  shared_preferences: ^2.3.3     # 非敏感设置（服务器地址列表等）
  http: ^1.2.0                    # flutter_cache_manager FileService 的 http 客户端载体
  flutter_cache_manager: ^3.4.2
  crypto: ^3.0.7
  path_provider: ^2.1.5          # 队列落盘/下载沙盒目录（M-A2 传输中心）
  file_picker: ^10.3.1           # 上传选文件/选照片（SAF，免存储权限）
  flutter_markdown: ^0.7.7       # 文档预览（v0.17）：md 渲染
  flutter_pdfview: ^1.3.4        # 文档预览（v0.17）：pdf 内嵌查看
  archive: ^4.5.2                # 文档预览（v0.17）：docx 解包取正文
  open_filex: ^4.7.0             # 已下载文件"用其他应用打开"（自带 FileProvider，免清单配置）
  sqflite: ^2.4.1                # 备份账本 SQLite（M-A3；设计选 SQLite，ORM 层 drift→裸 SQL
                                 #  省掉 build_runner 代码链，单表场景类型安全由模型类保证）
  local_auth: ^2.3.0             # 登录页生物识别一键登录（指纹/面部门禁已存凭据）
  mobile_scanner: ^5.2.3         # 登录页扫码填服务器地址（Web 端账号设置出地址二维码）
  # ── v0.6.0 全功能大批次（每项理由）─────────────────────────
  video_player: ^2.9.2           # 照片墙视频播放（ExoPlayer；自签 HTTPS 经本地媒体代理
                                 #  media_proxy 绕开——插件不暴露证书回调）
  qr_flutter: ^4.1.0             # 分享二维码本机渲染（qr 纯 Dart 绘制，免拉服务端 SVG）
  share_plus: ^10.1.2            # 分享链接经系统分享面板直发微信/QQ（official flutter.dev）
  package_info_plus: ^9.0.1      # 关于页/检查更新读取自身 version+build（official）
  flutter_local_notifications: ^18.0.1  # 传输完成系统通知（备份通知走 Kotlin 自有通道，
                                 #  App 内传输完成复用系统能力需本插件）
  # ── v0.8.5 主题引擎 ────────────────────────────────────────
  dynamic_color: ^2.1.0          # 「跟随壁纸」主题色（Android 12+ Material You 动态取色，official）
  # ── v0.11 家庭共创批次 ────────────────────────────────────
  # 照片墙瀑布流（SliverWaterfallFlow 保留 Sliver 虚拟化；v0.11 曾用
  # flutter_staggered_grid_view，其 SliverMasonryGrid 在"同 CustomScrollView
  # 多个瀑布流 sliver"下滚动修正有致命 bug（上游 issue #265/#286/#338，
  # 时间线按日分组恰好每天一个=必卡死），v0.13 换 waterfall_flow 修复）
  waterfall_flow: ^3.1.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  # 品牌开屏（v0.15.1）：launch window 直接画云朵 logo——Android 12+ 的
  # 系统开屏图标取自系统缓存的桌面图标，覆盖安装后长期不刷新（用户实测
  # "开屏 logo 未替换"），改用自己的 splash drawable 才拿回控制权
  flutter_native_splash: ^2.4.6

# flutter_native_splash 配置：改过配置/资源后跑
# `dart run flutter_native_splash:create` 重新生成 android 资源
flutter_native_splash:
  color: "#ffffff"
  color_dark: "#0B1020" # 云朵紫蓝主题 darkBg（app_theme.dart 派生底）
  image: splash/splash_logo.png
  image_dark: splash/splash_logo.png
  android: true
  ios: false
  web: false
  android_12:
    color: "#ffffff"
    color_dark: "#0B1020"
    image: splash/splash_android12.png
    image_dark: splash/splash_android12.png

flutter:
  uses-material-design: true
