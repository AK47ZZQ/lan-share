org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false
android.overridePathCheck=true
# 关闭 release R8 裁剪/混淆（Flutter 插件默认开启）：WorkManager 的 Room 库
# 在 R8 下启动即崩（反射实例化 WorkDatabase 失败）；家庭 App 无混淆收益，
# 稳定优先。见 docs/DEVELOPMENT.md §手机 App
shrink=false

# 资源名优化（aapt2 缩名）会让运行时按名字查找资源的调用失效：
# flutter_local_notifications 的 ic_notification 小图标、部分插件 getIdentifier。
# 家庭 App 体积不敏感，关闭换稳定（与上方 shrink=false 同理）。
android.enableResourceOptimizations=false
