# Dependabot 配置
#
# 默认行为是每天检查全部依赖，一个漏洞一个 PR，几天就能把 PR 列表刷满。
# 这里改成每周一次，并且把安全更新和常规更新分开分组，一次只对一个生态开
# 一个 PR。安全更新（security updates）不受这里的 schedule 控制，GitHub 发现
# 高危漏洞会立刻提，那部分保持敏感是对的。

version: 2
updates:
  # ── Python 后端 ──────────────────────────────────────────────
  - package-ecosystem: pip
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Asia/Shanghai
    open-pull-requests-limit: 3
    groups:
      # 补丁和次要版本合成一个 PR，主要版本单独提
      pip-minor-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]
    labels:
      - dependencies
      - python
    commit-message:
      prefix: "chore(deps)"

  # ── Web 前端 ─────────────────────────────────────────────────
  - package-ecosystem: npm
    directory: "/web"
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Asia/Shanghai
    open-pull-requests-limit: 3
    groups:
      npm-minor-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]
      # vue 生态一起升，避免版本互相不兼容。
      # update-types 必须限死 minor+patch：曾经放行主版本，结果一条 PR 里
      # typescript 5→7、vite 6→8、vue-router 4→5 一起跳，vue-tsc 直接崩
      # （TS 7 把 ./lib/tsc 从 exports 里删了，vue-tsc 还在找它）。
      # 主版本单独提，单独验。
      vue-ecosystem:
        patterns: ["vue", "vue-router", "vite", "@vitejs/*", "vue-tsc", "typescript"]
        update-types: ["minor", "patch"]
    ignore:
      # TypeScript 7 是 Go 重写版，改了 exports 布局，vue-tsc 3.x 还没适配。
      # 等 vue-tsc 明确支持再放开，手动升。
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
      # vite 主版本涉及配置格式变化，手动升
      - dependency-name: "vite"
        update-types: ["version-update:semver-major"]
      # vue-router 5 有 API 变更，手动升
      - dependency-name: "vue-router"
        update-types: ["version-update:semver-major"]
    labels:
      - dependencies
      - javascript
    commit-message:
      prefix: "chore(deps)"

  # ── Flutter 手机端 ───────────────────────────────────────────
  - package-ecosystem: pub
    directory: "/mobile"
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Asia/Shanghai
    open-pull-requests-limit: 2
    labels:
      - dependencies
      - dart
    commit-message:
      prefix: "chore(deps)"

  # ── CI 工作流本身 ────────────────────────────────────────────
  # actions/checkout@v4 这类引用会过时，值得跟着升
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly
    open-pull-requests-limit: 2
    labels:
      - dependencies
      - ci
    commit-message:
      prefix: "chore(ci)"
