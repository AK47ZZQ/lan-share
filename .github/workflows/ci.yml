name: ci

# 11 号复审批次 1（P1-2）+ 批次 3（PG 覆盖）：
# 此前质量门禁只靠人记得跑 check.bat，且测试只跑 SQLite、生产跑 PostgreSQL。
# 本工作流把"门禁"变成"push 即强制"，并让同一套测试在**两条引擎**上各跑一遍。

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  quality-gate:
    name: pytest (SQLite) + ruff + mypy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: ruff（错误级 + pyflakes + bugbear）
        run: python -m ruff check app tests server.py

      # App 侧分层守卫（2026-09-11）：UI 层不得直连 dio——07 审查把这判为 P1，
      # 纯静态扫描、无需 Dart 工具链，故并入本 job（基线见 scripts/ui_layering_baseline.txt）
      - name: UI 分层守卫（mobile/lib/ui 不得直连 dio）
        run: python scripts/check-ui-layering.py

      # v3.56：业务层 SQL 里出现 PG 不认的 SQLite 方言（rowid/PRAGMA/AUTOINCREMENT…）
      # 即红。起因是 `ORDER BY added_at DESC, rowid DESC` 门禁全绿上线、生产 PG
      # 每 30s 抛 UndefinedColumn，缩略图预热静默停摆数日。纯静态扫描，零依赖。
      - name: SQLite 专有语法守卫（双引擎 SQL 可移植性）
        run: python scripts/check-sqlite-isms.py

      - name: mypy
        run: python -m mypy app

      # 仓库 certs/ 是 gitignore 的（私钥不入库）：CI 现场自签一张，
      # healthreport 的证书天数与 entries 的指纹测试才能贴近生产路径
      - name: 生成测试用自签证书（certs/）
        run: openssl req -x509 -newkey rsa:2048 -keyout certs/key.pem -out certs/cert.pem -days 3650 -nodes -config certs/san.cnf

      # 占位前端产物：app/main.py 在 web/dist/index.html 缺失时会对页面路由回
      # 503 维护页，而 test_adversarial_v1 的两个 SPA 深链回退测试只断言
      # 「200 + text/html」，不需要真实构建产物。真构建要多 1-2 分钟且受 npm 网络影响。
      - name: 占位前端产物（SPA 回退测试用）
        run: mkdir -p web/dist && printf '<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><title>test</title></head><body></body></html>' > web/dist/index.html
      - name: pytest（SQLite · 默认引擎）
        run: python -m pytest tests/ -q

  pg-coverage:
    name: pytest (PostgreSQL)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: lanshare
          POSTGRES_PASSWORD: lanshare
          POSTGRES_DB: lanshare
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U lanshare"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # 同一套测试、同一个夹具；只换 DATABASE_URL —— 覆盖 _PgConn/_pg_sql/
      # _PG_SCHEMA 这条**生产真正在跑**的代码路（此前零自动化覆盖）。
      # 仓库 certs/ 是 gitignore 的（私钥不入库）：CI 现场自签一张，
      # healthreport 的证书天数与 entries 的指纹测试才能贴近生产路径
      - name: 生成测试用自签证书（certs/）
        run: openssl req -x509 -newkey rsa:2048 -keyout certs/key.pem -out certs/cert.pem -days 3650 -nodes -config certs/san.cnf

      # 占位前端产物：app/main.py 在 web/dist/index.html 缺失时会对页面路由回
      # 503 维护页，而 test_adversarial_v1 的两个 SPA 深链回退测试只断言
      # 「200 + text/html」，不需要真实构建产物。真构建要多 1-2 分钟且受 npm 网络影响。
      - name: 占位前端产物（SPA 回退测试用）
        run: mkdir -p web/dist && printf '<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><title>test</title></head><body></body></html>' > web/dist/index.html
      - name: pytest（PostgreSQL · 临时 schema 隔离）
        env:
          LANSHARE_TEST_PG_URL: postgresql://lanshare:lanshare@127.0.0.1:5432/lanshare
        run: python -m pytest tests/ -q

  web-tests:
    name: web 单元测试 + 构建
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      # 单元测试本身零依赖（node:test + 内置 TS 剥离），不需要装 node_modules。
      # 放在 npm ci 之前跑，快 20 秒。
      - name: node --test
        working-directory: web
        run: npm test

      # 构建是必须的：依赖升级时 vue-tsc 的类型检查、vite 的打包都可能崩，
      # 而 node:test 那 19 个用例完全不碰这两条链。
      # 曾经因此合并过一个跑不起来的前端（typescript 7 + vue-tsc 3 不兼容，
      # 报 ERR_PACKAGE_PATH_NOT_EXPORTED: './lib/tsc'），PR 上 CI 全绿。
      # 多花 1-2 分钟换这个保障，值。
      - name: 安装依赖
        working-directory: web
        run: npm ci

      - name: 构建（vue-tsc 类型检查 + vite build）
        working-directory: web
        run: npm run build
