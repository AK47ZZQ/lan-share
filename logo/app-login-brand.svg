<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" role="img" aria-label="LAN Share 登录页品牌头">
  <!-- 对应 App 登录页上半屏品牌区：渐变背景 + 白圆角图标块 + 云朵（实心） -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#5B6CFF"/>
      <stop offset="100%" stop-color="#895BFF"/>
    </linearGradient>
  </defs>
  <!-- 渐变背景（与登录页品牌头同色/同向，左上→右下） -->
  <rect width="24" height="24" rx="3" ry="3" fill="url(#bg)"/>
  <!-- 白半透明圆角图标块（占据中部 12×12 区域） -->
  <rect x="6" y="6" width="12" height="12" rx="2.625" ry="2.625" fill="#FFFFFF" fill-opacity="0.24"/>
  <!-- Material Symbols `cloud`（官方 SVG 路径 24×24，闭合路径实心渲染）
       注意：M 19.35 10.04 ... 这条路径在 Material 里是描边轮廓图标，
       移走 stroke 并直接用 fill 可被 svglib 完整绘制。 -->
  <g transform="translate(7.5 7.5) scale(0.375)">
    <path fill="#FFFFFF"
          d="M19.35 10.04C18.67 6.59 15.64 4 12 4 9.11 4 6.6 5.64 5.35 8.04 2.5 8.36 0.27 10.89 0.27 13.77 0.27 16.66 2.5 18.89 5.39 18.89H19.04C21.13 18.66 22.75 16.82 22.75 14.66 22.75 12.5 21.13 10.66 19.04 10.66Z"/>
  </g>
</svg>