<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>LAN Share</title>
<link rel="icon" type="image/svg+xml" href="/static/favicon.svg">
<meta name="theme-color" content="#070b14">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --bg:#070b14;--surface:rgba(22,28,44,.66);--surface-solid:#141a28;--surface2:#1b2234;--surface3:#242c42;
  --border:rgba(255,255,255,.07);--border-strong:rgba(255,255,255,.12);
  --text:#e9ecf4;--text2:#8189a0;
  --accent:#6d9cff;--accent2:#8a6cff;--accent-grad:linear-gradient(135deg,#6d9cff,#8a6cff);
  --accent-glow:rgba(109,156,255,.16);
  --green:#34d399;--red:#fb7185;--orange:#fb923c;
  --folder-bg:rgba(109,156,255,.14);--folder-border:rgba(109,156,255,.28);
  --shadow-lg:0 12px 40px rgba(0,0,0,.45);--shadow-btn:0 4px 16px rgba(109,156,255,.32);
}
body{
  font-family:-apple-system,'SF Pro Text','Segoe UI',system-ui,sans-serif;
  color:var(--text);min-height:100dvh;padding-bottom:88px;-webkit-tap-highlight-color:transparent;
  touch-action:manipulation;
  background:
    radial-gradient(1100px 700px at 82% -12%, rgba(109,156,255,.09), transparent 60%),
    radial-gradient(900px 620px at -8% 108%, rgba(138,108,255,.07), transparent 55%),
    var(--bg);
}
a{color:var(--accent);text-decoration:none}
/* 兜底：按钮内 SVG 一律锁定尺寸，防止未约束的图标撑爆布局 */
.btn svg{width:16px;height:16px;flex-shrink:0}
::-webkit-scrollbar{width:8px;height:8px}
::-webkit-scrollbar-thumb{background:rgba(255,255,255,.12);border-radius:4px}
::-webkit-scrollbar-track{background:transparent}

/* Header */
.header{position:sticky;top:0;z-index:10;background:rgba(9,13,24,.62);backdrop-filter:blur(20px) saturate(150%);-webkit-backdrop-filter:blur(20px) saturate(150%);border-bottom:1px solid var(--border);padding:12px 16px;display:flex;align-items:center;gap:10px}
.logo-mark{width:30px;height:30px;flex-shrink:0;filter:drop-shadow(0 2px 8px rgba(109,156,255,.4))}
.header h1{font-size:17px;font-weight:700;flex:1;letter-spacing:-.3px;white-space:nowrap}
.header .badge{font-size:10px;color:var(--text2);background:rgba(255,255,255,.05);border:1px solid var(--border);padding:3px 8px;border-radius:99px;white-space:nowrap}
.header .badge.warn{color:var(--orange);background:rgba(251,146,60,.1);border-color:rgba(251,146,60,.25)}
.header-icon{width:34px;height:34px;display:flex;align-items:center;justify-content:center;color:var(--text2);cursor:pointer;border-radius:10px;transition:all .18s ease}
.header-icon:hover{background:rgba(255,255,255,.07);color:var(--text)}
.header-icon:active{transform:scale(.88)}
.header-icon svg{width:19px;height:19px}

/* Tabs */
.tabs{display:flex;background:rgba(15,20,34,.7);backdrop-filter:blur(12px);border-bottom:1px solid var(--border);padding:0 10px;overflow-x:auto;-webkit-overflow-scrolling:touch}
.tab{display:flex;align-items:center;gap:6px;padding:11px 15px;font-size:13px;font-weight:500;color:var(--text2);cursor:pointer;white-space:nowrap;border-bottom:2px solid transparent;transition:all .18s ease}
.tab svg{width:16px;height:16px;opacity:.8}
.tab.active{color:var(--text);border-bottom-color:transparent;position:relative}
.tab.active::after{content:'';position:absolute;left:12px;right:12px;bottom:-1px;height:2px;border-radius:2px;background:var(--accent-grad);box-shadow:0 0 12px rgba(109,156,255,.6)}
.tab:active{background:rgba(255,255,255,.03)}

/* Search */
.search-bar{padding:8px 12px;background:rgba(15,20,34,.7);display:none}
.search-bar.show{display:block}
.search-input{width:100%;padding:10px 14px 10px 38px;border-radius:12px;border:1px solid var(--border);background:var(--surface2);color:var(--text);font-size:14px;outline:none;transition:border .18s,box-shadow .18s}
.search-input:focus{border-color:rgba(109,156,255,.5);box-shadow:0 0 0 3px var(--accent-glow)}
.search-wrap{position:relative;color:var(--text2)}
.search-wrap svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);width:16px;height:16px}
.search-clear{position:absolute;right:10px;top:50%;transform:translateY(-50%);font-size:15px;color:var(--text2);cursor:pointer;background:none;border:none;width:24px;height:24px;border-radius:6px;transition:background .15s}
.search-clear:hover{background:rgba(255,255,255,.07)}

/* Breadcrumb + sort bar */
.sub-bar{padding:8px 16px;font-size:12px;display:flex;align-items:center;gap:8px;border-bottom:1px solid var(--border);background:rgba(15,20,34,.5)}
.breadcrumb{display:flex;gap:5px;flex-wrap:wrap;align-items:center;flex:1;font-size:13px}
.breadcrumb span{cursor:pointer;transition:color .15s;display:flex;align-items:center}
.breadcrumb svg{width:15px;height:15px;color:var(--text2);transition:color .15s}
.breadcrumb span:hover,.breadcrumb span:active{color:var(--accent)}
.breadcrumb span:hover svg{color:var(--accent)}
.breadcrumb .sep{color:rgba(255,255,255,.18);cursor:default;font-size:11px}
.sort-btn{font-size:12px;color:var(--text2);cursor:pointer;padding:5px 10px;border-radius:8px;white-space:nowrap;border:1px solid var(--border);background:var(--surface2);transition:all .15s}
.sort-btn:hover{color:var(--text);border-color:var(--border-strong)}
.sort-btn:active{transform:scale(.95)}

/* File type icon badges */
.ft-icon{width:44px;height:44px;border-radius:13px;display:flex;align-items:center;justify-content:center;flex-shrink:0;font-size:10px;font-weight:700;letter-spacing:.4px}
.ft-icon svg{width:24px;height:24px}
.ft-media{padding:0;overflow:hidden}
.ft-media img{width:100%;height:100%;object-fit:cover}
.ft-img{background:rgba(244,114,182,.14);color:#f472b6}
.ft-vid{background:rgba(167,139,250,.16);color:#a78bfa}
.ft-aud{background:rgba(251,191,36,.13);color:#fbbf24}
.ft-apk{background:rgba(52,211,153,.13);color:#34d399}
.ft-zip{background:rgba(251,146,60,.13);color:#fb923c}
.ft-doc{background:rgba(109,156,255,.15);color:#6d9cff}
.ft-code{background:rgba(34,211,238,.12);color:#22d3ee}
.ft-other{background:var(--surface3);color:var(--text2)}
.ft-folder{background:var(--folder-bg);color:var(--accent)}

/* File list */
.file-list{padding:8px 12px}
.file-card{
  display:flex;align-items:center;gap:14px;padding:12px 14px;margin-bottom:6px;border-radius:16px;
  border:1px solid var(--border);transition:all .18s ease;cursor:pointer;position:relative;
  background:linear-gradient(180deg,rgba(255,255,255,.028),rgba(255,255,255,.008)) , var(--surface-solid);
}
.fresh .file-card{animation:cardIn .3s cubic-bezier(.2,.7,.3,1) both}
@keyframes cardIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.file-card:hover{transform:translateY(-1px);border-color:rgba(109,156,255,.28);box-shadow:0 8px 24px rgba(0,0,0,.35)}
.file-card:active{transform:scale(.985)}
.file-card.folder{border-color:var(--folder-border)}
.file-card.folder:hover{border-color:rgba(109,156,255,.5);box-shadow:0 8px 28px rgba(109,156,255,.12)}
.file-card.selected{border-color:rgba(109,156,255,.65);background:linear-gradient(180deg,var(--accent-glow),rgba(109,156,255,.05)),var(--surface-solid)}

.file-info{flex:1;min-width:0}
.file-name{font-size:14px;font-weight:600;letter-spacing:-.2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.file-meta{font-size:11px;color:var(--text2);margin-top:3px;display:flex;align-items:center;gap:5px}
.file-meta .tag{background:rgba(255,255,255,.05);padding:1px 6px;border-radius:5px;font-size:10px;font-weight:600}
.file-card.folder .file-meta .tag{background:var(--folder-bg);color:var(--accent)}
.file-arrow{color:var(--text2);font-size:15px;flex-shrink:0;opacity:.4;transition:all .18s}
.file-card:hover .file-arrow{opacity:.8;transform:translateX(2px);color:var(--accent)}
.file-card.folder .file-arrow{opacity:.7;color:var(--accent)}
.file-check{width:22px;height:22px;border-radius:7px;border:2px solid var(--border-strong);display:none;align-items:center;justify-content:center;flex-shrink:0;font-size:12px;color:#fff;transition:all .15s}
.selecting .file-check{display:flex}
.file-card.selected .file-check{background:var(--accent-grad);border-color:transparent;box-shadow:0 2px 8px rgba(109,156,255,.4)}

/* Back button */
.back-btn{position:fixed;bottom:96px;left:14px;width:50px;height:50px;border-radius:50%;background:var(--accent-grad);color:#fff;border:none;cursor:pointer;z-index:20;display:none;align-items:center;justify-content:center;box-shadow:var(--shadow-btn);transition:all .18s}
.back-btn svg{width:22px;height:22px}
.back-btn:active{transform:scale(.88)}
.back-btn.show{display:flex}

/* Action bar */
.action-bar{position:fixed;bottom:0;left:0;right:0;background:rgba(9,13,24,.78);backdrop-filter:blur(20px) saturate(150%);-webkit-backdrop-filter:blur(20px) saturate(150%);border-top:1px solid var(--border);padding:10px 14px;display:flex;gap:8px;z-index:10;padding-bottom:max(10px,env(safe-area-inset-bottom))}
.action-bar .btn{flex:1;display:flex;align-items:center;gap:6px;justify-content:center;padding:11px;font-size:13px;border-radius:12px;font-weight:600;border:none;cursor:pointer;transition:all .15s}
.action-bar .btn svg{width:16px;height:16px}
.action-bar .btn-primary{background:var(--accent-grad);color:#fff;box-shadow:var(--shadow-btn)}
.action-bar .btn-primary:hover{filter:brightness(1.12)}
.action-bar .btn-ghost{background:var(--surface2);color:var(--text);border:1px solid var(--border)}
.action-bar .btn-ghost:hover{background:var(--surface3)}
.action-bar .btn:active{transform:scale(.95)}

/* Batch bar */
.batch-bar{position:fixed;bottom:0;left:0;right:0;background:rgba(15,20,34,.92);backdrop-filter:blur(20px);border-top:1px solid rgba(109,156,255,.25);padding:10px 14px;display:none;gap:8px;z-index:11;padding-bottom:max(10px,env(safe-area-inset-bottom))}
.batch-bar.show{display:flex}
.batch-bar .btn{flex:1;display:flex;align-items:center;justify-content:center;gap:6px;padding:11px;font-size:13px;border-radius:12px;font-weight:600;border:none;cursor:pointer;transition:all .15s}
.batch-bar .btn svg{width:16px;height:16px;flex-shrink:0}
.batch-bar .btn-ghost{border:1px solid var(--border)}
.batch-bar .batch-count{font-size:13px;color:var(--text);display:flex;align-items:center;gap:6px;white-space:nowrap;font-weight:600}
.batch-bar .btn-danger{background:linear-gradient(135deg,#fb7185,#f43f5e);color:#fff}
.batch-bar .btn-ghost{background:var(--surface2);color:var(--text)}
.batch-bar .btn:active{transform:scale(.95)}

/* Upload area */
.upload-area{margin:10px 12px;padding:30px 16px;border:2px dashed rgba(255,255,255,.14);border-radius:18px;text-align:center;color:var(--text2);cursor:pointer;transition:all .25s cubic-bezier(.2,.7,.3,1);background:rgba(255,255,255,.02)}
.upload-area .up-icon{font-size:0;margin-bottom:8px}
.upload-area .up-icon svg{width:36px;height:36px;color:var(--accent);opacity:.9}
.upload-area .up-text{font-size:13px}
.upload-area:hover{border-color:rgba(109,156,255,.4);color:var(--text)}
.upload-area.dragover{border-color:var(--accent);background:var(--accent-glow);transform:scale(1.015)}
.upload-area input{display:none}

/* Upload progress */
.progress-wrap{padding:0 12px;margin-bottom:8px;display:none}
.progress-wrap.show{display:block}
.progress-file{font-size:12px;color:var(--text2);margin-bottom:5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.progress-bar{height:5px;background:var(--surface3);border-radius:3px;overflow:hidden}
.progress-fill{height:100%;background:var(--accent-grad);border-radius:3px;transition:width .3s;width:0;position:relative;overflow:hidden}
.progress-fill::after{content:'';position:absolute;inset:0;background:linear-gradient(90deg,transparent,rgba(255,255,255,.35),transparent);animation:shine 1.4s infinite}
@keyframes shine{from{transform:translateX(-100%)}to{transform:translateX(100%)}}

/* Context menu */
.ctx-menu{position:fixed;z-index:50;background:rgba(24,30,48,.92);backdrop-filter:blur(20px);border:1px solid var(--border-strong);border-radius:16px;padding:6px;min-width:190px;box-shadow:var(--shadow-lg);animation:ctxPop .16s cubic-bezier(.34,1.45,.64,1);transform-origin:top left}
@keyframes ctxPop{from{opacity:0;transform:scale(.9)}to{opacity:1;transform:scale(1)}}
.ctx-item{display:flex;align-items:center;gap:11px;padding:9px 12px;border-radius:10px;font-size:13px;cursor:pointer;transition:background .12s}
.ctx-item:hover{background:rgba(255,255,255,.06)}
.ctx-item .ci{width:20px;height:20px;display:flex;align-items:center;justify-content:center;flex-shrink:0;color:var(--text2)}
.ctx-item .ci svg{width:17px;height:17px}
.ctx-item.danger{color:var(--red)}
.ctx-item.danger .ci{color:var(--red)}
.ctx-sep{height:1px;background:var(--border);margin:3px 8px}

/* Modal */
.modal-overlay{position:fixed;inset:0;background:rgba(3,6,12,.6);backdrop-filter:blur(8px);display:flex;align-items:flex-end;justify-content:center;z-index:120;padding:0;animation:fadeIn .18s ease}
@keyframes fadeIn{from{opacity:0}}
.modal{background:linear-gradient(180deg,rgba(255,255,255,.03),transparent),var(--surface-solid);border:1px solid var(--border-strong);border-bottom:none;border-radius:22px 22px 0 0;padding:22px 18px;padding-bottom:max(22px,env(safe-area-inset-bottom));width:100%;max-width:500px;max-height:85vh;overflow-y:auto;animation:slideUp .3s cubic-bezier(.32,.72,0,1);box-shadow:var(--shadow-lg)}
@keyframes slideUp{from{transform:translateY(60%);opacity:.4}to{transform:none;opacity:1}}
.modal h3{margin-bottom:16px;font-size:17px;font-weight:700}
.modal label{display:block;font-size:12px;color:var(--text2);margin-bottom:6px}
.modal input[type=text],.modal input[type=number],.modal input[type=password],.modal select{width:100%;padding:10px 13px;border-radius:11px;border:1px solid var(--border);background:var(--surface2);color:var(--text);font-size:14px;margin-bottom:12px;outline:none;transition:border .18s,box-shadow .18s}
.modal input:focus,.modal select:focus{border-color:rgba(109,156,255,.5);box-shadow:0 0 0 3px var(--accent-glow)}
.modal .actions{display:flex;gap:8px;margin-top:4px}
.modal .actions .btn{flex:1;display:flex;justify-content:center;padding:11px;border-radius:12px;font-size:14px;font-weight:600;border:none;cursor:pointer;transition:all .15s}
.modal .actions .btn:active{transform:scale(.96)}
.modal .btn-ghost{background:var(--surface2);color:var(--text)}
.modal .btn-primary{background:var(--accent-grad);color:#fff;box-shadow:var(--shadow-btn)}

/* Share result */
.share-result{text-align:center;padding:6px 0}
.share-result .qr{margin:10px auto;max-width:160px;border-radius:14px;background:#fff;padding:8px}
.share-result .url{font-size:11px;color:var(--text2);word-break:break-all;background:var(--surface2);padding:9px;border-radius:10px;margin-top:8px;font-family:'SF Mono',monospace;cursor:pointer;transition:color .15s}
.share-result .url:hover{color:var(--accent)}

/* Share list */
.share-list{max-height:50vh;overflow-y:auto}
.share-item{display:flex;align-items:center;gap:10px;padding:11px 12px;border-radius:12px;background:var(--surface2);margin-bottom:7px;border:1px solid var(--border)}
.share-item .si-info{flex:1;min-width:0}
.share-item .si-name{font-size:13px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.share-item .si-meta{font-size:11px;color:var(--text2);margin-top:2px}
.share-item .si-revoke{font-size:11px;color:var(--red);cursor:pointer;padding:5px 9px;border-radius:8px;border:none;background:rgba(251,113,133,.1);white-space:nowrap;transition:all .15s}
.share-item .si-revoke:hover{background:rgba(251,113,133,.2)}
.share-item .si-revoke.blue{color:var(--accent);background:rgba(109,156,255,.1)}
.share-item .si-revoke.blue:hover{background:rgba(109,156,255,.2)}

/* Filter chips */
.filter-bar{display:flex;gap:6px;padding:8px 12px;overflow-x:auto;-webkit-overflow-scrolling:touch;background:rgba(15,20,34,.7);display:none}
.filter-bar.show{display:flex}
.chip{padding:6px 12px;border-radius:99px;font-size:12px;font-weight:500;cursor:pointer;border:1px solid var(--border);background:var(--surface2);color:var(--text2);white-space:nowrap;transition:all .18s}
.chip:hover{color:var(--text);border-color:var(--border-strong)}
.chip.active{background:var(--accent-grad);color:#fff;border-color:transparent;box-shadow:0 2px 10px rgba(109,156,255,.3)}

/* Disk detail */
.disk-legend{display:flex;flex-direction:column;gap:8px}
.disk-legend-item{display:flex;align-items:center;gap:8px;font-size:12px}

/* Photo timeline */
.photo-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:3px;padding:3px}
.photo-grid img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:6px;cursor:pointer;background:var(--surface3);animation:photoIn .45s ease both;transition:transform .2s,box-shadow .2s}
@keyframes photoIn{from{opacity:0;transform:scale(.96)}to{opacity:1;transform:scale(1)}}
.photo-grid img:hover{transform:scale(1.04);box-shadow:0 8px 24px rgba(0,0,0,.5);z-index:1;position:relative}
.photo-date{padding:12px 16px 6px;font-size:13px;font-weight:700;color:var(--text)}
.photo-more{margin:14px auto;display:block;padding:10px 24px;border-radius:99px;border:1px solid var(--border);background:var(--surface2);color:var(--text);font-size:13px;cursor:pointer;transition:all .18s}
.photo-more:hover{border-color:var(--border-strong);background:var(--surface3)}

/* Empty state */
.empty{text-align:center;padding:56px 20px;color:var(--text2)}
.empty .e-ico{width:72px;height:72px;margin:0 auto 16px;border-radius:24px;background:rgba(109,156,255,.08);display:flex;align-items:center;justify-content:center;color:var(--accent);opacity:.8}
.empty .e-ico svg{width:34px;height:34px}
.empty .title{font-size:15px;font-weight:600;color:var(--text);margin-bottom:5px}
.empty .hint{font-size:12px;line-height:1.6}

/* Toast */
.toast{position:fixed;top:18px;left:50%;transform:translateX(-50%) translateY(-8px);background:linear-gradient(135deg,#34d399,#10b981);color:#04110b;padding:10px 18px;border-radius:12px;font-size:13px;font-weight:600;z-index:200;opacity:0;transition:all .25s cubic-bezier(.2,.7,.3,1);pointer-events:none;box-shadow:0 8px 28px rgba(0,0,0,.4)}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.toast.error{background:linear-gradient(135deg,#fb7185,#f43f5e);color:#fff}

/* Skeleton */
.skel{padding:6px 12px}
.skel-i{display:flex;align-items:center;gap:14px;padding:12px 14px;margin-bottom:6px;border-radius:16px;background:var(--surface-solid);border:1px solid var(--border)}
.skel-icon{width:44px;height:44px;border-radius:13px;background:var(--surface3);animation:shimmer 1.4s infinite}
.skel-lines{flex:1}
.skel-line{height:11px;border-radius:5px;background:var(--surface3);animation:shimmer 1.4s infinite;margin-bottom:8px}
.skel-line:last-child{width:55%;margin-bottom:0}
@keyframes shimmer{0%{opacity:.45}50%{opacity:.85}100%{opacity:.45}}

/* Preview modal */
.preview-overlay{position:fixed;inset:0;background:rgba(2,4,10,.88);backdrop-filter:blur(16px);z-index:110;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:20px;animation:fadeIn .18s}
.preview-overlay .close-btn{position:absolute;top:12px;right:16px;font-size:22px;color:#fff;cursor:pointer;z-index:111;background:rgba(255,255,255,.1);width:38px;height:38px;border-radius:50%;display:flex;align-items:center;justify-content:center;border:none;transition:all .15s}
.preview-overlay .close-btn:hover{background:rgba(255,255,255,.2)}
.preview-overlay img,.preview-overlay video,.preview-overlay audio{max-width:100%;max-height:80vh;border-radius:10px;animation:photoIn .3s ease}
.preview-overlay iframe{width:100%;height:80vh;border:none;border-radius:10px;background:#fff}
.preview-overlay .preview-name{color:#aab;text-align:center;font-size:13px;margin-top:10px}
.preview-overlay .preview-ops{display:flex;gap:10px;margin-top:12px}
.preview-overlay .preview-ops button{padding:9px 18px;border-radius:10px;font-size:13px;font-weight:600;border:none;cursor:pointer;transition:all .15s}
.preview-overlay .preview-ops button:active{transform:scale(.95)}

@media(min-width:600px){.photo-grid{grid-template-columns:repeat(5,1fr)}}

/* ── 移动端适配 ── */
@media(max-width:480px){
  .header{padding:10px;gap:7px}
  .header h1{font-size:15px}
  /* 小屏空间有限：徽标隐藏（磁盘/文件数各有入口可查） */
  .header .badge{display:none}
  .header-icon{width:31px;height:31px}
  .tabs{padding:0 6px}
  .tab{padding:10px 11px;font-size:12px;gap:5px}
  .search-bar{padding:6px 8px}
  .search-input{font-size:16px}  /* ≥16px 避免 iOS 聚焦自动放大 */
  .filter-bar{padding:6px 8px}
  .sub-bar{padding:8px 10px}
  .sub-bar .breadcrumb{font-size:12px}
  .file-list{padding:6px 8px}
  .file-card{padding:10px 11px;gap:11px;border-radius:14px}
  .ft-icon{width:40px;height:40px;border-radius:11px}
  .file-name{font-size:13px}
  .action-bar{padding:8px 10px}
  .action-bar .btn{padding:10px 4px;font-size:12px}
  .batch-bar{padding:8px 10px;gap:6px}
  .batch-bar .btn{padding:10px 2px;font-size:12px}
  .batch-bar .batch-count{font-size:12px}
  .modal{padding:18px 14px}
  .modal input{font-size:16px}
  .modal .actions .btn{padding:12px}
  .toast{max-width:92vw;font-size:12px}
  .photo-grid{gap:2px;padding:2px}
  .preview-overlay{padding:10px}
  .preview-overlay iframe{height:75vh}
}
@media(prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;transition-duration:.01ms!important}}
</style>
</head>
<body>

<div class="header">
  <svg class="logo-mark" viewBox="0 0 64 64"><defs><linearGradient id="lg" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#6d9cff"/><stop offset="1" stop-color="#8a6cff"/></linearGradient></defs><rect x="2" y="2" width="60" height="60" rx="16" fill="url(#lg)"/><path d="M14 22a4 4 0 0 1 4-4h8l4 5h16a4 4 0 0 1 4 4v17a4 4 0 0 1-4 4H18a4 4 0 0 1-4-4V22z" fill="rgba(255,255,255,.92)"/><path d="M14 28h36v2H14z" fill="rgba(109,156,255,.35)"/></svg>
  <h1>LAN Share</h1>
  <span class="badge" id="file-count"></span>
  <span class="badge" id="disk-info">-</span>
  <span class="header-icon" data-act="showShares" title="分享管理"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"/><path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"/></svg></span>
  <span class="header-icon" data-act="showTrash" title="回收站"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6"/><path d="M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg></span>
  <span class="header-icon" data-act="showPhoneQR" title="手机传文件"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="7" y="2" width="10" height="20" rx="2"/><path d="M11 18h2"/></svg></span>
  <span class="header-icon" data-act="showDiskDetail" title="磁盘详情"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><ellipse cx="12" cy="5" rx="9" ry="3"/><path d="M3 5v14a9 3 0 0 0 18 0V5"/><path d="M3 12a9 3 0 0 0 18 0"/></svg></span>
  <span class="header-icon" data-act="toggleSearch" title="搜索"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg></span>
  <span class="header-icon" data-act="showAccountModal" title="账号设置"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="7.5" cy="15.5" r="5.5"/><path d="m21 2-9.6 9.6"/><path d="m15.5 7.5 3 3L22 7l-3-3"/></svg></span>
  <span class="header-icon" data-act="logout" title="退出登录"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18.36 6.64a9 9 0 1 1-12.73 0"/><path d="M12 2v10"/></svg></span>
</div>

<div class="tabs" id="main-tabs">
  <div class="tab active" data-tab="files" data-act="switchTab" data-t="files"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20h16a2 2 0 0 0 2-2V8a2 2 0 0 0-2-2h-7.9a2 2 0 0 1-1.69-.9L9.6 3.9A2 2 0 0 0 7.93 3H4a2 2 0 0 0-2 2v13c0 1.1.9 2 2 2Z"/></svg>文件</div>
  <div class="tab" data-tab="photos" data-act="switchTab" data-t="photos"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="9" cy="9" r="2"/><path d="m21 15-3.1-3.1a2 2 0 0 0-2.8 0L6 21"/></svg>照片</div>
  <div class="tab" data-tab="recent" data-act="switchTab" data-t="recent"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M12 6v6l4 2"/></svg>最近</div>
</div>

<div class="search-bar" id="search-bar">
  <div class="search-wrap">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
    <input class="search-input" id="search-input" placeholder="搜索文件名...">
    <button class="search-clear" data-act="clearSearch">✕</button>
  </div>
</div>

<div class="filter-bar" id="filter-bar">
  <div class="chip active" data-filter="all" data-act="setFilter" data-f="all">全部</div>
  <div class="chip" data-filter="folder" data-act="setFilter" data-f="folder">文件夹</div>
  <div class="chip" data-filter="image" data-act="setFilter" data-f="image">图片</div>
  <div class="chip" data-filter="video" data-act="setFilter" data-f="video">视频</div>
  <div class="chip" data-filter="doc" data-act="setFilter" data-f="doc">文档</div>
  <div class="chip" data-filter="archive" data-act="setFilter" data-f="archive">压缩包</div>
  <div class="chip" data-filter="apk" data-act="setFilter" data-f="apk">APK</div>
</div>

<div class="sub-bar" id="sub-bar">
  <div class="breadcrumb" id="breadcrumb"></div>
  <button class="sort-btn" id="sort-btn" data-act="cycleSort">↕ 排序</button>
</div>

<div class="file-list" id="file-list">
  <div class="skel"><div class="skel-i"><div class="skel-icon"></div><div class="skel-lines"><div class="skel-line"></div><div class="skel-line"></div></div></div><div class="skel-i"><div class="skel-icon"></div><div class="skel-lines"><div class="skel-line"></div><div class="skel-line"></div></div></div><div class="skel-i"><div class="skel-icon"></div><div class="skel-lines"><div class="skel-line"></div><div class="skel-line"></div></div></div></div>
</div>

<div class="progress-wrap" id="progress-wrap">
  <div class="progress-file" id="progress-file"></div>
  <div class="progress-bar"><div class="progress-fill" id="progress-fill"></div></div>
</div>

<div class="upload-area" id="upload-area" style="display:none" data-act="triggerUpload">
  <div class="up-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><path d="m17 8-5-5-5 5"/><path d="M12 3v12"/></svg></div>
  <div class="up-text">拖拽文件到这里，或点击选择</div>
  <input type="file" id="file-input">
</div>

<button class="back-btn" id="back-btn" data-act="goBack"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5"/><path d="m12 19-7-7 7-7"/></svg></button>

<div class="action-bar" id="action-bar">
  <button class="btn btn-ghost" data-act="enterSelectMode"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 11l3 3L22 4"/><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/></svg>选择</button>
  <button class="btn btn-ghost" data-act="showMkdirModal"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20h16a2 2 0 0 0 2-2V8a2 2 0 0 0-2-2h-7.9a2 2 0 0 1-1.69-.9L9.6 3.9A2 2 0 0 0 7.93 3H4a2 2 0 0 0-2 2v13c0 1.1.9 2 2 2Z"/><path d="M12 10v6"/><path d="M9 13h6"/></svg>新建</button>
  <button class="btn btn-primary" data-act="triggerUpload"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><path d="m17 8-5-5-5 5"/><path d="M12 3v12"/></svg>上传</button>
</div>

<div class="batch-bar" id="batch-bar">
  <div class="batch-count"><span id="batch-n">0</span> 项</div>
  <button class="btn btn-ghost" id="selall-btn" data-act="selectAll">全选</button>
  <button class="btn btn-ghost" data-act="exitSelectMode">取消</button>
  <button class="btn btn-ghost" data-act="batchDownload"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><path d="m7 10 5 5 5-5"/><path d="M12 15V3"/></svg></button>
  <button class="btn btn-danger" data-act="batchDelete"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6"/><path d="M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg></button>
</div>

<div class="toast" id="toast"></div>

<script src="/static/index.js"></script>
</body>
</html>
