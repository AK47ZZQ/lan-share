<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>分享链接</title>
<link rel="icon" type="image/svg+xml" href="/static/favicon.svg">
<meta name="theme-color" content="#070b14">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--bg:#070b14;--surface:#141a28;--surface2:#1b2234;--border:rgba(255,255,255,.08);--text:#e9ecf4;--text2:#8189a0;--accent:#6d9cff;--accent-grad:linear-gradient(135deg,#6d9cff,#8a6cff);--green:#34d399;--red:#fb7185}
body{
  font-family:-apple-system,'SF Pro Text','Segoe UI',system-ui,sans-serif;color:var(--text);min-height:100dvh;display:flex;align-items:center;justify-content:center;padding:20px;
  background:radial-gradient(900px 600px at 75% -10%, rgba(109,156,255,.12), transparent 60%),radial-gradient(700px 500px at 0% 110%, rgba(138,108,255,.1), transparent 55%),var(--bg);
}
.card{background:linear-gradient(180deg,rgba(255,255,255,.03),transparent),var(--surface);border-radius:24px;padding:34px 26px;width:100%;max-width:390px;text-align:center;border:1px solid var(--border);box-shadow:0 24px 70px rgba(0,0,0,.5);animation:cardIn .45s cubic-bezier(.2,.7,.3,1) both}
@keyframes cardIn{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.ft-badge{width:64px;height:64px;margin:0 auto 14px;border-radius:18px;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:800;letter-spacing:.5px;animation:pop .4s cubic-bezier(.34,1.45,.64,1) both .1s}
@keyframes pop{from{opacity:0;transform:scale(.7)}to{opacity:1;transform:scale(1)}}
.ft-img{background:rgba(244,114,182,.14);color:#f472b6}
.ft-vid{background:rgba(167,139,250,.16);color:#a78bfa}
.ft-aud{background:rgba(251,191,36,.13);color:#fbbf24}
.ft-apk{background:rgba(52,211,153,.13);color:#34d399}
.ft-zip{background:rgba(251,146,60,.13);color:#fb923c}
.ft-doc{background:rgba(109,156,255,.15);color:#6d9cff}
.ft-code{background:rgba(34,211,238,.12);color:#22d3ee}
.ft-other{background:rgba(255,255,255,.06);color:var(--text2)}
h2{font-size:16px;margin-bottom:6px;word-break:break-all;font-weight:700;line-height:1.4}
.meta{font-size:12px;color:var(--text2);margin-bottom:20px}
.pwd-input{width:100%;padding:12px 14px;border-radius:12px;border:1px solid var(--border);background:var(--surface2);color:var(--text);font-size:15px;margin-bottom:14px;text-align:center;outline:none;transition:border .18s,box-shadow .18s}
.pwd-input:focus{border-color:rgba(109,156,255,.5);box-shadow:0 0 0 3px rgba(109,156,255,.16)}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;padding:13px;border-radius:13px;border:none;font-size:15px;font-weight:700;cursor:pointer;background:var(--accent-grad);color:#fff;width:100%;transition:all .18s;box-shadow:0 4px 16px rgba(109,156,255,.32)}
.btn:hover{filter:brightness(1.1)}
.btn:active{transform:scale(.97)}
.btn:disabled{opacity:.4;cursor:not-allowed;transform:none;filter:none}
.error{color:var(--red);font-size:13px;margin-top:12px}
@media(prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;transition-duration:.01ms!important}}
</style>
</head>
<body>
<div class="card">
  <div class="ft-badge ft-other" id="icon">···</div>
  <h2 id="filename">加载中...</h2>
  <div class="meta" id="meta"></div>
  <div id="pwd-section" style="display:none">
    <input class="pwd-input" type="password" id="pwd" placeholder="请输入提取码">
  </div>
  <button class="btn" id="dl-btn" disabled>⬇️ 下载</button>
  <div class="error" id="error" style="display:none"></div>
</div>

<script src="/static/share.js"></script>
</body>
</html>
