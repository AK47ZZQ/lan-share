<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>传文件到电脑</title>
<link rel="icon" type="image/svg+xml" href="/static/favicon.svg">
<meta name="theme-color" content="#070b14">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--bg:#070b14;--surface:#141a28;--surface2:#1b2234;--border:rgba(255,255,255,.08);--text:#e9ecf4;--text2:#8189a0;--accent:#6d9cff;--accent-grad:linear-gradient(135deg,#6d9cff,#8a6cff);--green:#34d399;--red:#fb7185}
body{
  font-family:-apple-system,'SF Pro Text','Segoe UI',system-ui,sans-serif;color:var(--text);min-height:100dvh;display:flex;align-items:center;justify-content:center;padding:16px;
  background:radial-gradient(900px 600px at 75% -10%, rgba(109,156,255,.12), transparent 60%),radial-gradient(700px 500px at 0% 110%, rgba(138,108,255,.1), transparent 55%),var(--bg);
}
.card{background:linear-gradient(180deg,rgba(255,255,255,.03),transparent),var(--surface);border-radius:24px;padding:30px 24px;width:100%;max-width:400px;border:1px solid var(--border);box-shadow:0 24px 70px rgba(0,0,0,.5);animation:cardIn .45s cubic-bezier(.2,.7,.3,1) both}
@keyframes cardIn{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
h2{text-align:center;font-size:17px;font-weight:700;margin-bottom:4px}
.sub{text-align:center;font-size:12px;color:var(--text2);margin-bottom:20px}
.drop{border:2px dashed rgba(255,255,255,.16);border-radius:18px;padding:36px 16px;text-align:center;cursor:pointer;transition:all .25s cubic-bezier(.2,.7,.3,1)}
.drop:hover{border-color:rgba(109,156,255,.4)}
.drop.dragover{border-color:var(--accent);background:rgba(109,156,255,.12);transform:scale(1.02)}
.drop .icon{width:44px;height:44px;margin:0 auto 10px;border-radius:14px;background:rgba(109,156,255,.12);display:flex;align-items:center;justify-content:center;color:var(--accent)}
.drop .icon svg{width:24px;height:24px}
.drop .txt{font-size:13px;color:var(--text2)}
.drop input{display:none}
.list{margin-top:14px;max-height:50vh;overflow-y:auto}
.item{background:var(--surface2);border:1px solid var(--border);border-radius:14px;padding:11px 13px;margin-bottom:8px}
.item .row{display:flex;align-items:center;gap:8px}
.item .name{flex:1;font-size:13px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item .st{font-size:11px;color:var(--text2);white-space:nowrap}
.item .st.ok{color:var(--green)}
.item .st.err{color:var(--red)}
.bar{height:4px;background:rgba(255,255,255,.08);border-radius:2px;overflow:hidden;margin-top:8px}
.fill{height:100%;background:var(--accent-grad);border-radius:2px;transition:width .3s;width:0}
.hint{margin-top:14px;text-align:center;font-size:11px;color:var(--text2);line-height:1.7}
</style>
</head>
<body>
<div class="card">
  <h2>📲 传文件到电脑</h2>
  <div class="sub">文件将上传到电脑的 incoming/ 目录</div>
  <div class="drop" id="drop">
    <div class="icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><path d="m17 8-5-5-5 5"/><path d="M12 3v12"/></svg></div>
    <div class="txt">点选 或 拖入文件（可多选）</div>
    <input type="file" id="file-input" multiple>
  </div>
  <div class="list" id="list"></div>
  <div class="hint">支持断点续传与内容去重<br>大文件请保持页面打开直到完成</div>
</div>

<script src="/static/up.js"></script>
</body>
</html>
